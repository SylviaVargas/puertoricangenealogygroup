  body: "La página de detalle de Guaynabo ya está disponible — con la historia de su fundación en 1769 en el sitio de Caparra (el primer asentamiento europeo de Puerto Rico), sus 10 barrios, registros parroquiales desde 1765 en la parroquia de San Pedro Mártir de Verona, registro civil desde 1886, simbolismo del escudo municipal y una guía completa de investigación genealógica con enlaces a FamilySearch. Incluye orientación para rastrear antepasados durante el período de supresión municipal (1875–1912)."
