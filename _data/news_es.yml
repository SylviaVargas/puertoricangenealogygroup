  title: "Nuevo Curso: Buscando Antepasados en Periódicos Históricos Puertorriqueños"
  body: "Un curso intermedio gratuito de 5 lecciones sobre cómo encontrar y usar periódicos históricos digitalizados de Puerto Rico para la genealogía. Cubre Chronicling America, ADNPR, dLOC, El Mundo y más. Incluye un caso real de 1872 en Rincón y términos de búsqueda para registros relacionados con la esclavitud."
