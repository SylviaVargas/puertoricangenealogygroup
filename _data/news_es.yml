  title: "Próximamente: Registro de Investigadores del PRGG"
  body: "Estamos construyendo un registro controlado donde los miembros aprobados podrán documentar antepasados puertorriqueños por nombre, municipio y rango de años, enlazar registros en FamilySearch o Ancestry, y conectar con otros investigadores de las mismas familias. El acceso requiere un formulario de solicitud y aprobación del administrador para garantizar la calidad de los datos según el GPS."
