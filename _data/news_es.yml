  title: "Nuevo: Página de Detalle del Municipio Guánica"
  body: "La página de detalle de Guánica ya está disponible — con la historia de uno de los sitios de asentamiento más antiguos de Puerto Rico (Guaynia, 1508), la fundación del municipio en 1914 a partir de Yauco, sus 11 barrios, registros parroquiales de San Antonio Abad desde 1885, índices comunitarios de registros eclesiásticos hasta 1944 y una nota clave sobre cómo buscar registros del área de Guánica anteriores a 1914 bajo Yauco."
  link: /es/guia-municipios/guanica/

