- date: 2026-05-04
  category: funciones
  featured: true
  title: "Nuevo: Página de Detalle del Municipio Bayamón"
  body: "La página de detalle de Bayamón ya está disponible — con la historia de la 'Ciudad del Chicharrón' y su fundación en 1772 en tierras de la jurisdicción de San Juan, sus 12 barrios, registros parroquiales en La Invención de la Santa Cruz desde 1772, registro civil desde 1885, simbolismo del escudo municipal y una guía completa de investigación genealógica que incluye el Cementerio Nacional de Puerto Rico y orientación para rastrear familias entre Bayamón y sus tres municipios hijos: Guaynabo, Comerío y Cataño."
  link: /es/guia-municipios/bayamon/

