- date: 2026-05-18
  category: funciones
  featured: true
  title: "Nuevo: Página de Detalle del Municipio Barranquitas"
  body: "La página de detalle de Barranquitas ya está disponible — con la historia de este municipio de la Cordillera Central fundado en 1803 junto con su parroquia San Antonio de Padua. Barranquitas no tiene divisiones formales de barrios, lo que convierte los registros parroquiales y civiles en las principales herramientas de localización. También es el lugar de nacimiento del estadista Luis Muñoz Rivera (1859-1916), cuyos registros familiares aparecen en los archivos parroquiales."
  link: /es/guia-municipios/barranquitas/

- date: 2026-05-18
  category: funciones
  featured: false
  title: "Nuevo: Página de Detalle del Municipio Canóvanas"
  body: "La página de detalle de Canóvanas ya está disponible — con la historia de un municipio con una trayectoria administrativa inusualmente compleja: barrio de Loíza durante más de 400 años, brevemente consolidado en Río Grande en 1902 y reestablecido en 1909. Incluye sus 8 barrios, registros parroquiales de Nuestra Señora del Pilar desde 1903, un catálogo combinado de registros civiles de Loíza y Canóvanas en FamilySearch y una guía de investigación para rastrear familias a través de tres períodos administrativos."
  link: /es/guia-municipios/canovanas/

- date: 2026-05-18
  category: funciones
