- date: 2026-05-04
  category: funciones
  featured: false
  title: "Mejorado: Página de Detalle del Municipio Guaynabo"
  body: "La página de detalle de Guaynabo ha sido ampliada con cuatro nuevas fuentes genealógicas: el perfil del Municipio del Censo de EE. UU., el catálogo de registro civil de FamilySearch (1886), los Padrones de Esclavos de 1872 para las jurisdicciones del norte, y los registros de cementerios de Find A Grave. La investigación en Guaynabo requiere navegar tres épocas: registros previos a 1769 en San Juan y Bayamón, la era parroquial independiente (1769-1885) y la laguna de supresión (1875-1912) cuando los barrios fueron absorbidos por Bayamón y Río Piedras."
  link: /es/guia-municipios/guaynabo/

