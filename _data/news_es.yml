- date: 2026-05-05
  category: funciones
  featured: false
  title: "Nuevo: Página de Detalle del Municipio San Juan"
  body: "La página de detalle de San Juan ya está disponible — con la historia del primer asentamiento español de Puerto Rico en 1521, sus 18 barrios (incluyendo los barrios de Río Piedras incorporados en 1951), los registros sacramentales de la catedral desde 1625, registro civil desde 1885 y una guía completa de investigación genealógica con enlaces a FamilySearch, el Archivo Arzobispal y cementerios históricos. La vasta jurisdicción original de San Juan dio origen a Bayamón, Caguas, Guaynabo, Loíza, Toa Alta, Toa Baja y Trujillo Alto."
  link: /es/guia-municipios/san-juan/

- date: 2026-05-05
  category: funciones
  featured: false
  title: "Nuevo: Página de Detalle del Municipio Trujillo Alto"
  body: "La página de detalle de Trujillo Alto ya está disponible — con la historia del municipio del Área Metro de San Juan y su fundación en 1801, sus 6 barrios, registros parroquiales en Santa Cruz de Trujillo Alto desde 1840, registro civil desde 1885, simbolismo del escudo municipal y una guía completa de investigación genealógica. Los investigadores deben tener en cuenta que Carolina se separó de Trujillo Alto en 1817, por lo que las familias anteriores a esa fecha de esa área aparecen en los registros de Trujillo Alto."
  link: /es/guia-municipios/trujillo-alto/

