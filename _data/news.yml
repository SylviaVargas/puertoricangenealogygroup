- date: 2026-05-04
  category: features
  featured: false
  title: "Enhanced: Guaynabo Municipality Detail Page"
  body: "The Guaynabo detail page has been expanded with four new genealogy sources: the U.S. Census Bureau municipio profile, the FamilySearch civil registration catalog (1886), the 1872 Slave Schedules for the northern jurisdictions, and Find A Grave cemetery records. Guaynabo's research requires navigating three eras — pre-1769 San Juan/Bayamón records, the independent parish era (1769-1885), and the suppression gap (1875-1912) when barrios were absorbed by Bayamón and Río Piedras."
  link: /tools/municipality-guide/guaynabo/

