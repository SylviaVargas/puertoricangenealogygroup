- date: 2026-05-04
  category: features
  featured: false
  title: "New: Caguas Municipality Detail Page"
  body: "The Caguas detail page is now live — covering the 'Ciudad Criolla' and its 1775 founding from San Juan's jurisdiction, its 11 barrios in the Turabo valley, parish records at Catedral Dulce Nombre de Jesús from 1730 (among the earliest interior records on the island), civil registry from 1885, coat of arms symbolism, and a full genealogy research toolkit. Caguas is the mother town of San Lorenzo (1811), Gurabo (1815), and Aguas Buenas (1838), making its records essential for researchers tracing ancestors across the central-eastern region."
  link: /tools/municipality-guide/caguas/

