- date: 2026-05-05
  category: features
  featured: false
  title: "New: San Juan Municipality Detail Page"
  body: "The San Juan detail page is now live — covering Puerto Rico's original 1521 Spanish settlement, its 18 barrios (including former Río Piedras barrios incorporated in 1951), the cathedral's sacramental records dating to 1625, civil registry from 1885, and a full genealogy research toolkit linking to FamilySearch, the Archivo Arzobispal, and historical cemeteries. San Juan's vast early jurisdiction gave rise to Bayamón, Caguas, Guaynabo, Loíza, Toa Alta, Toa Baja, and Trujillo Alto."
  link: /tools/municipality-guide/san-juan/

- date: 2026-05-05
  category: features
  featured: false
  title: "New: Trujillo Alto Municipality Detail Page"
  body: "The Trujillo Alto detail page is now live — covering the San Juan Metro municipality and its 1801 founding, its 6 barrios, parish records at Santa Cruz de Trujillo Alto from 1840, civil registry from 1885, coat of arms symbolism, and a full genealogy research toolkit. Researchers should note that Carolina was carved from Trujillo Alto in 1817, so pre-Carolina families from that area appear in Trujillo Alto records."
  link: /tools/municipality-guide/trujillo-alto/

- date: 2026-05-05
  category: features
  featured: false
  title: "New: Maunabo Municipality Detail Page"
