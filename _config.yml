# PuertoRicanGenealogy.org
# Jekyll configuration for bilingual site

title: PuertoRicanGenealogy.org
tagline: "Conectando Raíces, Celebrando Herencia"
description: "A grassroots community dedicated to helping individuals explore their Puerto Rican ancestry through records, research guides, and a supportive community."
url: "https://puertoricangenealogy.org"
baseurl: ""

# Contact
email: puertoricangenealogygroup@gmail.com

# Author and copyright
author:
  name: "Sylvia Vargas"
  url: "https://looking4myroots.com"
copyright_year_start: "2024"
trademark: "Teaching Genealogists AI™"

# Related sites
wordpress_site: "https://looking4myroots.com"

# Build settings
markdown: kramdown
highlighter: rouge

# Theme and styling
remote_theme: pages-themes/minimal@v0.2.0

# Plugins
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap

# Language configuration
default_lang: en
languages:
  - en
  - es

# Language names for display
language_names:
  en: "English"
  es: "Español"

# Collections
collections:
  research-guides:
    output: true
    permalink: /:collection/:name/
  resources:
    output: true
    permalink: /:collection/:name/
  municipalities:
    output: true
    permalink: /tools/municipality-guide/:name/

# Defaults for pages
defaults:
  - scope:
      path: ""
    values:
      layout: default
      lang: en
      image: /assets/images/banner-social.jpg
  - scope:
      path: "es"
    values:
      lang: es
  - scope:
      path: "_research-guides"
    values:
      layout: guide
      parent_title: "Research Guides"
      parent_url: /research-guides/
      parent_title_es: "Guías de Investigación"
      parent_url_es: /es/guias-investigacion/
  - scope:
      path: "_research-guides/census-records"
    values:
      parent_title: "Census Records for Puerto Rican Genealogy"
      parent_url: /research-guides/census-records/
      parent_title_es: "Registros Censales para la Genealogía Puertorriqueña"
      parent_url_es: /es/guias-investigacion/registros-censales/
  - scope:
      path: "_research-guides/navigating-civil-records"
    values:
      parent_title: "Navigating Puerto Rico's Civil Records (1885–Present)"
      parent_url: /research-guides/navigating-civil-records/
      parent_title_es: "Navegando los Registros Civiles de Puerto Rico (1885–Presente)"
      parent_url_es: /es/guias-investigacion/navegar-registros-civiles/
  - scope:
      path: "_research-guides/getting-started"
    values:
      parent_title: "Getting Started in Genealogy: A Free Beginner Course"
      parent_url: /research-guides/getting-started/
      parent_title_es: "Empezando en Genealogía: Un Curso Gratuito para Principiantes"
      parent_url_es: /es/guias-investigacion/empezar/
  - scope:
      path: "_research-guides/ai-research-organization"
    values:
      parent_title: "AI Tools for Research and Organization"
      parent_url: /research-guides/ai-research-organization/
      parent_title_es: "Herramientas de IA para Investigación y Organización"
      parent_url_es: /es/guias-investigacion/ia-investigacion-organizacion/
  - scope:
      path: "_research-guides/slave-records"
    values:
      parent_title: "Puerto Rican Slave Record Research"
      parent_url: /research-guides/slave-records/
      parent_title_es: "Investigación de Registros de Esclavos Puertorriqueños"
      parent_url_es: /es/guias-investigacion/registros-esclavos/
  - scope:
      path: "_research-guides/pr-newspapers"
    values:
      parent_title: "Looking for Ancestors in Historical Puerto Rican Newspapers"
      parent_url: /research-guides/pr-newspapers/
      parent_title_es: "Buscando Antepasados en Periódicos Históricos Puertorriqueños"
      parent_url_es: /es/guias-investigacion/periodicos-pr/
  - scope:
      path: "_resources"
    values:
      layout: resource
  - scope:
      path: ""
      type: municipalities
    values:
      layout: municipality
      lang: en

# Navigation structure (used by includes/nav.html)
navigation:
  en:
    - title: Home
      url: /
    - title: Meetings
      url: /meetings/
    - title: Research Guides
      url: /research-guides/
    - title: Resources
      url: /resources/
    - title: AI in Genealogy
      url: /ai-genealogy/
    - title: Tools
      url: /tools/
    - title: Contact
      url: /contact/
  es:
    - title: Inicio
      url: /es/
    - title: Reuniones
      url: /es/reuniones/
    - title: Guías de Investigación
      url: /es/guias-investigacion/
    - title: Recursos
      url: /es/recursos/
    - title: IA en Genealogía
      url: /es/ia-genealogia/
    - title: Herramientas
      url: /es/herramientas/
    - title: Contacto
      url: /es/contacto/

# Social links
social:
  facebook: puertoricangenealogygroup

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - TODO.md
  - LICENSE
  - URL_INVENTORY.md
  - url_report.md
  - vendor
