<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">

  <!--
    Content-Security-Policy (defense in depth on a static site).
    GitHub Pages cannot send real response headers, so this is delivered as
    a meta tag. Hosts allowlisted below match the resources loaded in this
    file: Google Fonts (style + font), GA4 (googletagmanager), and
    GoatCounter (gc.zgo.at + the project's goatcounter subdomain).
    'unsafe-inline' is required for the inline GA4/GoatCounter config and the
    JSON-LD block; the host allowlist still blocks injected external scripts
    and exfiltration to non-allowlisted origins. frame-ancestors and
    X-Frame-Options are not enforceable via meta on GitHub Pages.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://gc.zgo.at https://f.convertkit.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://www.google-analytics.com https://www.googletagmanager.com https://cdn.buymeacoffee.com https://f.convertkit.com; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com https://puertoricangenealogy.goatcounter.com https://f.convertkit.com https://app.kit.com; object-src 'none'; base-uri 'self'; form-action 'self' https://app.kit.com">

  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="author" content="{{ site.author.name }}">
  <meta name="copyright" content="&copy; {{ site.time | date: '%Y' }} {{ site.author.name }}">
  <meta name="rights" content="All rights reserved. {{ site.trademark }} is a trademark of {{ site.author.name }}.">

  <!-- Language -->
  <html lang="{{ page.lang | default: site.default_lang }}">

  <!-- Alternate language links for SEO -->
  {% if page.lang == 'es' %}
  <link rel="alternate" hreflang="en" href="{{ site.url }}{{ site.baseurl }}{{ page.url | replace: '/es/', '/' }}">
  <link rel="alternate" hreflang="es" href="{{ site.url }}{{ site.baseurl }}{{ page.url }}">
  {% else %}
  <link rel="alternate" hreflang="en" href="{{ site.url }}{{ site.baseurl }}{{ page.url }}">
  <link rel="alternate" hreflang="es" href="{{ site.url }}{{ site.baseurl }}/es{{ page.url }}">
  {% endif %}

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="{{ '/assets/images/logo-square.png' | relative_url }}">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">

  {% seo %}

  <!-- Organization structured data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "{{ site.title | escape }}",
    "url": "{{ site.url }}",
    "logo": "{{ site.url }}/assets/images/logo-primary.png",
    "founder": {
      "@type": "Person",
      "name": "{{ site.author.name }}",
      "url": "{{ site.author.url }}"
    },
    "copyrightHolder": {
      "@type": "Person",
      "name": "{{ site.author.name }}"
    },
    "copyrightYear": "{{ site.copyright_year_start }}",
    "contactPoint": {
      "@type": "ContactPoint",
      "email": "{{ site.email }}",
      "contactType": "customer support"
    },
    "sameAs": [
      "https://www.facebook.com/{{ site.social.facebook }}"
    ]
  }
  </script>

  <!-- Analytics: Google Analytics 4 (cookieless mode) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-4Q63ZLM6SJ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-4Q63ZLM6SJ', {
      'client_storage': 'none',
      'anonymize_ip': true
    });
  </script>

  <!-- Analytics: GoatCounter (no cookies, open-source) -->
  <script data-goatcounter="https://puertoricangenealogy.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</head>
