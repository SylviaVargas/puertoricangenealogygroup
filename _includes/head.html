<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">

  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">

  <!-- Language -->
  <html lang="{{ page.lang | default: site.default_lang }}">

  <!-- Alternate language links for SEO -->
  {% if page.lang == 'es' %}
  <link rel="alternate" hreflang="en" href="{{ site.url }}{{ page.url | replace: '/es/', '/' }}">
  <link rel="alternate" hreflang="es" href="{{ site.url }}{{ page.url }}">
  {% else %}
  <link rel="alternate" hreflang="en" href="{{ site.url }}{{ page.url }}">
  <link rel="alternate" hreflang="es" href="{{ site.url }}/es{{ page.url }}">
  {% endif %}

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="{{ '/assets/images/logo-square.png' | relative_url }}">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">

  {% seo %}
</head>
